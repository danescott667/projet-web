<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/style.css" />
    <title>Paramètres</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/supabase.js"></script>
    <script src="js/sessions.js" defer></script>
    <script src="js/parametres.js" defer></script>
  </head>

  <body>
    <!--En-tête commun aux pages connectées : logo, menu, déconnexion -->

    <header class="presentation">
      <img src="images/tchatlogo.png" alt="Logo de Tchat'" />
      <p>Vos conversations, simplement.</p>
      <nav>
        <ul>
          <li><a href="conversation.html">Conversations</a></li>
          <li><a href="contact.html">Contact</a></li>
          <li><a href="parametres.html">Paramètres</a></li>
        </ul>
      </nav>
      <button type="button" id="deconnexion">Se déconnecter</button>
    </header>
    <!--Paramètres : choix de la langue (Dane) -->

    <main>
      <h1>Paramètres</h1>
      <section class="connexion">
        <form>
          <label for="langue">Langue de traduction</label>
          <select id="langue">
            <option value="fr">FR</option>
            <option value="en">EN</option>
            <option value="es">ES</option>
            <option value="de">DE</option>
            <option value="zh">CN</option>
          </select>
          <button type="submit">Enregistrer</button>
          <p id="message-erreur"></p>
          <p id="message-succes"></p>
      </section>
    </main>
  </body>
</html>
