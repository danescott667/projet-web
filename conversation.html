<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/style.css" />
    <title>Salon</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/supabase.js"></script>
    <script src="js/sessions.js" defer></script>
    <script src="js/messages.js" defer></script>
    <script src="js/traduction.js" defer></script>

  </head>

  <body>
    <!--En-tête commun aux pages connectées : logo, menu, déconnexion -->

    <header class="presentation">
      <img src="images/tchatlogo.png" alt="Logo de Tchat'" />
      <p>Vos conversations, simplement.</p>
      <nav>
        <ul>
          <li><a href="conversation.html">Conversations</a></li>
          <li><a href="contact.html">Contact</a></li>
          <li><a href="parametres.html">Paramètres</a></li>
        </ul>
      </nav>
      <button type="button" id="deconnexion">Se déconnecter</button>
    </header>

    <!-- Conteneur principal avec deux colonnes -->
    <div class="profil">

        <!-- Section de gauche : liste des salons -->
        <aside class="liste-conversation">
            <h2>Salons</h2>
            <input id="salon-recherche" type="search" placeholder="Rechercher un salon...">
            <button class="recherche">Rechercher</button>
            <div id="liste-conversations" class="liste-conversations"></div>
            <button id="creer-salon" class="creer-salon">Créer un salon</button>
        </aside>

        <!-- Section de droite : affichage des messages du salon sélectionné et barre de saisie -->
        <section class="message-container">
            <h2 id="salon-titre" class="salon-titre">Sélectionner un salon</h2>
            <div id="messages" class="messages">
                <div id="historique-messages" class="historique-messages"></div>
            </div>
            <form id="formulaire" class="envoi-barre">
                <input id="message" type="text" placeholder="Nouveaux messages..." />
                <button type="submit">Envoyer</button>
            </form>
        </section>
    </div>
    
    <!-- Fenêtre pour créer un salon -->
    <dialog id="fenetre-salon" class="fenetre-salon">
        <form method="dialog" id="form-salon">
            <h3>Créer un nouveau salon</h3>
            <input type="text" id="nom-nouveau-salon" class="input-salon" placeholder="Nom du salon..." required/>
            <div class="boutons-salon">
                <button type="button" id="btn-annuler">Annuler</button>
                <button type="submit">Créer le Salon</button>
            </div>
        </form>
    </dialog>
  </body>
</html>
