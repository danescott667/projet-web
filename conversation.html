<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="css/style.css" />
    <title>Contacts</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/supabase.js"></script>
    <script src="js/sessions.js" defer></script>
    <script src="js/messages.js" defer></script>
    <script src="js/traduction.js" defer></script>

  </head>

  <body>
    <!--En-tête commun aux pages connectées : logo, menu, déconnexion -->

    <header class="presentation">
      <img src="images/tchatlogo.png" alt="Logo de Tchat'" />
      <p>Vos conversations, simplement.</p>
      <nav>
        <ul>
          <li><a href="conversation.html">Conversations</a></li>
          <li><a href="contact.html">Contact</a></li>
          <li><a href="parametres.html">Paramètres</a></li>
        </ul>
      </nav>
      <button type="button" id="deconnexion">Se déconnecter</button>
    </header>

    <div class="profil">
        <aside class="liste-conversation">
            <h2>Discussions</h2>
            <input type="search" placeholder="Rechercher une discussion...">
            <button class="recherche">Rechercher</button>
            <div id="liste-conversations" class="liste-conversations"></div>
        </aside>
        <section class="message-container">
            <h2 id="destinataire-titre" class="destinataire-titre"></h2>
            <div id="messages" class="messages">
                <div id="historique-messages" class="historique-messages"></div>
            </div>
            <form id="formulaire" class="envoi-barre">
                <input id="message" type="text" placeholder="Nouveaux messages..." />
                <button type="submit">Envoyer</button>
            </form>
        </section>
    </div>

  </body>
</html>
