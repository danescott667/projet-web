<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="css/style.css">
    <title>Page d'inscription</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/supabase.js"></script>
</head>

<body>
    <main class="accueil">
        <!-- Partie du haut : présentation -->
        <section class="presentation">
            <img src="images/tchatlogo.png" alt="Logo de Tchat'">
            <p>Vos conversations, simplement.</p>
        </section>

        <!-- Partie du bas : formulaire d'inscription -->
        <section class="connexion">
            <h1>Créer un compte</h1>
            <form>
                <label for="pseudo">Pseudo :</label><br>
                <input type="text" id="pseudo" name="pseudo"><br>

                <label for="email">E-mail :</label><br>
                <input type="email" id="email" name="email"><br>

                <label for="mdp">Mot de Passe :</label><br>
                <input type="password" id="mdp" name="mdp"><br>

                <label for="cmdp"> Confirmer Mot de Passe :</label><br>
                <input type="password" id="cmdp" name="cmdp"><br>


                <button type="submit">S'inscrire</button>

            </form>
            <a href="index.html">Déjà un compte ? Se connecter</a>
        </section>
    </main>
</body>

</html>
